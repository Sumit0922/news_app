name: orbit_news
description: A space news reader built with MVVM, Clean Architecture and Riverpod.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_screenutil: ^5.9.3
  flutter_riverpod: ^3.4.3

  dio: ^5.11.1

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  go_router: ^18.1.0

  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  intl: ^0.20.3
  cached_network_image: ^4.0.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: '>=2.16.2 <2.17.0'
  freezed: ^4.0.2
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true